<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>تركيز - مؤقت بومودورو</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111827;color:#f1f5f9;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;transition:background .6s}
body.break{background:#052e2b}
.wrap{max-width:520px;margin:auto;padding:16px}
.tabs{display:flex;background:#0006;border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:#cbd5e1;padding:11px;border-radius:11px;font-size:15px;font-family:inherit}
.tabs button.on{background:#ffffff22;color:#fff;font-weight:700}
.ringbox{position:relative;width:min(80vw,300px);margin:8px auto}
svg{width:100%;display:block;transform:rotate(-90deg)}
circle{fill:none;stroke-width:12}
#bg{stroke:#ffffff18}
#fg{stroke:#f87171;stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .6s}
body.break #fg{stroke:#34d399}
.time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#t{font-size:58px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
#cur{font-size:14px;color:#cbd5e1;max-width:70%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:12px;justify-content:center;margin:14px 0}
.go{background:#f87171;color:#fff;border:0;border-radius:40px;padding:16px 50px;font-size:20px;font-weight:800;font-family:inherit}
body.break .go{background:#10b981}
.sec{background:#ffffff12;color:#fff;border:0;border-radius:40px;padding:16px 22px;font-size:16px;font-family:inherit}
.card{background:#0004;border-radius:18px;padding:14px;margin-top:14px}
.card h3{margin:0 0 10px;font-size:15px;color:#cbd5e1;font-weight:600}
.add{display:flex;gap:8px}
input{flex:1;background:#0006;border:1px solid #ffffff22;color:#fff;border-radius:12px;padding:12px;font-size:16px;font-family:inherit;min-width:0}
.add button{background:#334155;color:#fff;border:0;border-radius:12px;padding:0 18px;font-size:22px}
.task{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #ffffff12}
.task:last-child{border:0}
.task.sel{background:#f8717122;border-radius:10px}
.task .n{flex:1;min-width:0;font-size:16px}
.task.done .n{text-decoration:line-through;opacity:.5}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid #94a3b8;background:none;color:#fff;font-size:15px;padding:0}
.done .chk{background:#10b981;border-color:#10b981}
.pc{font-size:13px;color:#fca5a5;white-space:nowrap}
.x{background:none;border:0;color:#64748b;font-size:18px;padding:6px}
canvas{width:100%;display:block}
.row{display:flex;justify-content:space-between;color:#cbd5e1;font-size:14px;margin-bottom:6px}
.row b{color:#fff}
.pg{height:8px;background:#ffffff18;border-radius:6px;overflow:hidden;margin:6px 0 10px}.pg i{display:block;height:100%;background:#f87171;transition:width .4s}
.cfg{display:grid;grid-template-columns:1fr 90px;gap:8px 10px;align-items:center;font-size:14px;color:#cbd5e1}
.cfg input[type=number]{text-align:center;padding:8px}.cfg input[type=checkbox]{flex:none;width:22px;height:22px;justify-self:end}
.mini{background:#ffffff14;color:#cbd5e1;border:0;border-radius:10px;padding:5px 10px;font-size:12px;font-family:inherit}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ai{background:#ffffff0d;border-radius:12px;padding:8px 10px;font-size:13px;color:#94a3b8;border:1px solid transparent}.ai.on{color:#fff;background:#10b98133;border-color:#10b981}.ai b{display:block;font-size:14px}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:#10b981;color:#042;padding:10px 22px;border-radius:30px;font-weight:800;transition:.4s;z-index:9;pointer-events:none}#toast.on{transform:translate(-50%,0)}
.lvl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hd h3{margin:0}
</style>
</head>
<body>
<div id="toast"></div>
<div class="wrap">
  <div class="tabs"><button data-m="0" class="on">تركيز</button><button data-m="1">استراحة قصيرة</button><button data-m="2">استراحة طويلة</button></div>
  <div class="ringbox"><svg viewBox="0 0 200 200"><circle id="bg" cx="100" cy="100" r="90"/><circle id="fg" cx="100" cy="100" r="90" stroke-dasharray="565.5" stroke-dashoffset="0"/></svg>
    <div class="time"><div id="t">25:00</div><div id="cur">اختار مهمة</div></div></div>
  <div class="ctl"><button class="go" id="go">ابدأ</button><button class="sec" id="reset">إعادة</button><button class="sec" id="skip">تخطي</button></div>
  <div class="card"><div class="hd"><h3>المهام</h3><button class="mini" id="clr">امسح المنتهي</button></div><div class="add"><input id="in" placeholder="مهمة جديدة..." maxlength="60"><button id="addb">+</button></div><div id="list"></div></div>
  <div class="card"><h3>آخر ٧ أيام (جلسات تركيز)</h3><canvas id="ch" width="520" height="170"></canvas>
    <div class="row" style="margin-top:8px"><span>الهدف اليومي: <b id="goalv">٠</b></span><span>أيام متتالية: <b id="streak">٠</b> 🔥</span></div><div class="pg"><i id="gbar" style="width:0"></i></div>
    <div class="row" style="margin-top:8px"><span>النهارده: <b id="today">٠</b></span><span>الإجمالي: <b id="total">٠</b></span><span>الدقائق اليوم: <b id="mins">٠</b></span></div></div>
<div class="card"><div class="hd"><h3>المستوى والإنجازات</h3><span id="lvt" style="font-size:13px;color:#fcd34d"></span></div><div class="pg"><i id="xpb" style="width:0;background:#fbbf24"></i></div><div class="row"><span>أطول سلسلة أيام: <b id="bst">٠</b></span><span>إجمالي ساعات التركيز: <b id="hrs">٠</b></span></div><div class="ach" id="achg"></div></div>
<div class="card"><h3>الإعدادات</h3><div class="cfg">
    <label for="cf">مدة التركيز (دقيقة)</label><input id="cf" type="number" min="1" max="120" inputmode="numeric">
    <label for="cs">استراحة قصيرة (دقيقة)</label><input id="cs" type="number" min="1" max="60" inputmode="numeric">
    <label for="cl">استراحة طويلة (دقيقة)</label><input id="cl" type="number" min="1" max="90" inputmode="numeric">
    <label for="cg">هدف الجلسات في اليوم</label><input id="cg" type="number" min="1" max="30" inputmode="numeric">
    <label for="ca">ابدأ الجلسة اللي بعدها تلقائي</label><input id="ca" type="checkbox">
    <label for="cn">إشعار لما الجلسة تخلص</label><input id="cn" type="checkbox"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const FAST=location.search.includes("fast");
let DUR;
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
let S;try{S=JSON.parse(localStorage.getItem("focus1")||"null")}catch(e){}
S=S||{tasks:[],sel:null,log:{},cycle:0};
if(!Array.isArray(S.tasks))S.tasks=[];S.log=S.log||{};S.min=S.min||{};S.cfg=Object.assign({f:25,s:5,l:15,goal:8,auto:false,notif:false},S.cfg||{});
const save=()=>{try{localStorage.setItem("focus1",JSON.stringify(S))}catch(e){}};
const cl=(v,a,b,d)=>{v=Math.round(+v);return v>=a&&v<=b?v:d};
function applyCfg(){const c=S.cfg;DUR=FAST?[5,3,4]:[c.f*60,c.s*60,c.l*60]}applyCfg();
const ACHS=[["f1","البداية","أول جلسة تركيز",x=>x.n>=1],["f10","منتظم","10 جلسات",x=>x.n>=10],["f50","محترف","50 جلسة",x=>x.n>=50],["f200","أسطورة","200 جلسة",x=>x.n>=200],["g","هدف اليوم","حقق هدف اليوم",x=>x.goalHit],["d3","3 أيام","سلسلة 3 أيام",x=>x.best>=3],["d7","أسبوع كامل","سلسلة 7 أيام",x=>x.best>=7],["d30","شهر حديد","سلسلة 30 يوم",x=>x.best>=30],["h10","10 ساعات","10 ساعات تركيز",x=>x.min>=600],["h50","50 ساعة","50 ساعة تركيز",x=>x.min>=3000],["t5","منظّم","خلّص 5 مهام",x=>x.done>=5],["day8","يوم مزدحم","8 جلسات في يوم",x=>x.maxDay>=8]];
const TITLES=["مبتدئ","متحمس","منضبط","محترف","خبير","أسطورة"];
S.ach=S.ach||{};S.doneCount=S.doneCount||0;
function agg(){const vals=Object.values(S.log);const n=vals.reduce((a,b)=>a+b,0);const min=Object.keys(S.log).reduce((a,k)=>a+(S.min[k]!=null?S.min[k]:S.log[k]*25),0);
 const ks=Object.keys(S.log).filter(k=>S.log[k]>0).map(k=>{const p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getTime()}).sort((a,b)=>a-b);let best=0,cur=0,prev=0;for(const t of ks){cur=(prev&&Math.round((t-prev)/864e5)==1)?cur+1:1;best=Math.max(best,cur);prev=t}
 return{n,min,best,done:S.doneCount,maxDay:Math.max(0,...vals),goalHit:S.goalHit||vals.some(v=>v>=S.cfg.goal)&&S.goalHit}}
function chkAch(){const x=agg();let neu=null;for(const a of ACHS)if(!S.ach[a[0]]&&a[3](x)){S.ach[a[0]]=1;neu=a}
 if(neu){save();const t=$("toast");t.textContent="🏅 إنجاز جديد: "+neu[1];t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2800)}
 const lv=Math.min(TITLES.length-1,Math.floor(Math.sqrt(x.n/4)));const nxt=(lv+1)**2*4,base=lv**2*4;
 $("lvt").textContent="مستوى "+AR(lv+1)+" · "+TITLES[lv];$("xpb").style.width=Math.min(100,(x.n-base)/(nxt-base)*100)+"%";
 $("bst").textContent=AR(x.best);$("hrs").textContent=AR(Math.round(x.min/6)/10);
 $("achg").innerHTML=ACHS.map(a=>`<div class="ai ${S.ach[a[0]]?"on":""}"><b>${S.ach[a[0]]?"✅":"🔒"} ${a[1]}</b>${a[2]}</div>`).join("")}
let wl=null;
const dk=(d=new Date())=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
let mode=0,left=DUR[0],end=0,run=false,tick;
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.3,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.start(c.currentTime+t);o.stop(c.currentTime+t+.22)})}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200])}
function draw(){
  const m=Math.floor(left/60),s=Math.floor(left%60);
  const txt=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  $("t").textContent=txt;document.title=(run?txt+" · ":"")+"تركيز";
  $("fg").style.strokeDashoffset=565.5*(1-left/DUR[mode]);
  document.body.classList.toggle("break",mode>0);
  document.querySelectorAll(".tabs button").forEach((b,i)=>b.classList.toggle("on",i==mode));
  $("go").textContent=run?"إيقاف مؤقت":"ابدأ";
  const t=S.tasks.find(x=>x.id==S.sel);$("cur").textContent=t?t.n:"اختار مهمة";
}
function setMode(m){stop();mode=m;left=DUR[m];draw()}
function stop(){run=false;clearInterval(tick);if(S.run){S.run=null;save()}try{wl&&wl.release&&wl.release();wl=null}catch(e){}}
function start(){if(run)return;run=true;end=Date.now()+left*1000;tick=setInterval(step,200);S.run={mode,end};save();try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}draw()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&run){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}step()}});
function step(){left=Math.max(0,(end-Date.now())/1000);draw();if(left<=0)finish()}
function finish(){
  stop();beep();try{navigator.vibrate&&navigator.vibrate([200,100,200,100,300])}catch(e){}
  try{if(S.cfg.notif&&window.Notification&&Notification.permission==='granted')new Notification(mode==0?'خلصت جلسة التركيز 🍅':'الاستراحة خلصت، يلا نرجع',{body:mode==0?'خد استراحة':'ابدأ جلسة جديدة'})}catch(e){}
  if(mode==0){const k=dk();S.min[k]=(S.min[k]!=null?S.min[k]:(S.log[k]||0)*25)+Math.round(DUR[0]/60);S.log[k]=(S.log[k]||0)+1;S.cycle++;const t=S.tasks.find(x=>x.id==S.sel);if(t)t.p=(t.p||0)+1;save();stats();tasks();
    setMode(S.cycle%4==0?2:1);if(S.log[k]>=S.cfg.goal)S.goalHit=1;chkAch();if(S.log[k]==S.cfg.goal){$("cur").textContent="🎉 وصلت هدف اليوم!";setTimeout(draw,6000)}}else setMode(0);
  if(S.cfg.auto&&!FAST)start();
}
$("t").parentElement.style.cursor="pointer";$("t").parentElement.onclick=()=>$("go").click();
$("go").onclick=()=>run?(stop(),draw()):start();
$("reset").onclick=()=>setMode(mode);
$("skip").onclick=()=>setMode(mode==0?1:0);
$("clr").onclick=()=>{if(!S.tasks.some(t=>t.d))return;S.tasks=S.tasks.filter(t=>!t.d);if(!S.tasks.some(t=>t.id==S.sel))S.sel=null;save();tasks();draw()};
addEventListener("keydown",e=>{if(e.target.tagName=="INPUT")return;if(e.code=="Space"){e.preventDefault();$("go").click()}});
$("cf").value=S.cfg.f;$("cs").value=S.cfg.s;$("cl").value=S.cfg.l;$("cg").value=S.cfg.goal;$("ca").checked=S.cfg.auto;$("cn").checked=S.cfg.notif;
function cfgChange(){const c=S.cfg;c.f=cl($("cf").value,1,120,25);c.s=cl($("cs").value,1,60,5);c.l=cl($("cl").value,1,90,15);c.goal=cl($("cg").value,1,30,8);c.auto=$("ca").checked;c.notif=$("cn").checked;
  if(c.notif&&window.Notification&&Notification.permission==='default')Notification.requestPermission().then(p=>{if(p!=='granted'){c.notif=false;$("cn").checked=false;save()}});
  save();applyCfg();if(!run)left=DUR[mode];draw();stats()}
["cf","cs","cl","cg","ca","cn"].forEach(i=>$(i).onchange=cfgChange);
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
function tasks(){
  $("list").innerHTML=S.tasks.length?S.tasks.map(t=>`<div class="task ${t.d?"done":""} ${t.id==S.sel?"sel":""}" data-id="${t.id}"><button class="chk" data-a="c">${t.d?"✓":""}</button><div class="n" data-a="s">${t.n.replace(/</g,"&lt;")}</div><span class="pc">🍅 ${AR(t.p||0)}</span><button class="x" data-a="x">✕</button></div>`).join(""):'<p style="color:#94a3b8;text-align:center;margin:14px 0">ضيف أول مهمة، ودوس عليها لتختارها.</p>';
}
$("list").onclick=e=>{const el=e.target.closest("[data-a]");if(!el)return;const id=el.closest(".task").dataset.id,t=S.tasks.find(x=>String(x.id)==id),a=el.dataset.a;
  if(a=="c"){t.d=!t.d;S.doneCount=Math.max(0,(S.doneCount||0)+(t.d?1:-1));chkAch()}else if(a=="x"){S.tasks=S.tasks.filter(x=>x!==t);if(S.sel==t.id)S.sel=null}else S.sel=t.id;save();tasks();draw()};
function add(){const v=$("in").value.trim();if(!v)return;const t={id:Date.now(),n:v,p:0,d:false};S.tasks.push(t);if(!S.sel)S.sel=t.id;$("in").value="";save();tasks();draw()}
$("addb").onclick=add;$("in").onkeydown=e=>{if(e.key=="Enter")add()};
const DN=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
function stats(){
  const c=$("ch"),x=c.getContext("2d");x.clearRect(0,0,520,170);
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push([d,S.log[dk(d)]||0])}
  const mx=Math.max(4,...days.map(d=>d[1]));
  days.forEach(([d,v],i)=>{const X=14+i*72,h=v/mx*100;x.fillStyle=i==6?"#f87171":"#f8717188";x.beginPath();x.roundRect(X,125-h,46,Math.max(h,3),8);x.fill();
    x.fillStyle="#cbd5e1";x.font="15px system-ui";x.textAlign="center";x.fillText(DN[d.getDay()],X+23,150);if(v)x.fillText(AR(v),X+23,118-h)});
  const tot=Object.values(S.log).reduce((a,b)=>a+b,0),td=S.log[dk()]||0;
  $("today").textContent=AR(td);$("total").textContent=AR(tot);$("mins").textContent=AR(S.min[dk()]!=null?S.min[dk()]:td*25);
  const g=S.cfg.goal;$("goalv").textContent=AR(td)+" / "+AR(g);$("gbar").style.width=Math.min(100,td/g*100)+"%";
  let st=0;const d0=new Date();if(!(S.log[dk(d0)]>0))d0.setDate(d0.getDate()-1);while(S.log[dk(d0)]>0&&st<3650){st++;d0.setDate(d0.getDate()-1)}$("streak").textContent=AR(st);
}
if(location.search.includes("demo")&&!S.tasks.length){S.tasks=[{id:1,n:"مذاكرة جافاسكريبت",p:4,d:false},{id:2,n:"مراجعة الإيميلات",p:1,d:true},{id:3,n:"تمرين رياضة",p:0,d:false}];S.sel=1;
  [0,1,2,3,4,5,6].forEach((i,j)=>{const d=new Date();d.setDate(d.getDate()-i);S.log[dk(d)]=[5,3,6,0,4,2,7][j]})}
tasks();stats();draw();chkAch();
if(S.run&&S.run.end){mode=S.run.mode|0;if(mode<0||mode>2)mode=0;const rem=(S.run.end-Date.now())/1000;if(rem>0){left=rem;start()}else{left=0;S.run=null;finish()}draw()}
window.T={chk:chkAch,S:()=>S,get s(){return{mode,run,left,cycle:S.cycle,today:S.log[dk()]||0}},FAST};
</script>
</body></html>
